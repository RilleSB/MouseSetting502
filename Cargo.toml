[package]
name = "ghub_rust"
version = "2.0.0"
edition = "2024"

[dependencies]
hidapi = "2.6.7"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.18.1", features = ["backend-default", "renderer-femtovg"] }
webbrowser = "1.2.5"
tempfile = "3.27"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
] }
